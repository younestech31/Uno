config:
  target: "http://localhost:3000"
  phases:
    - duration: 60
      arrivalRate: 20
      rampTo: 100
      name: "Ramp up to 1,000 concurrent game rooms"
    - duration: 180
      arrivalRate: 100
      name: "Sustained high load: 1,000 rooms"
  ws:
    subprotocols:
      - "websocket"
  processor: "./bot-scenario.js"

scenarios:
  - name: "Full Multiplayer Game Flow"
    engine: "socketio"
    flow:
      - emit:
          channel: "session:heartbeat"
          data:
            clientTime: 1700000000000
      - emit:
          channel: "room:create"
          data:
            targetScore: 150
            maxPlayers: 4
            houseRules:
              stacking: true
              jumpIn: true
          response:
            channel: "room:state"
      - think: 1
      - emit:
          channel: "chat:send"
          data:
            text: "Good luck and have fun clashers!"
      - think: 2
      - emit:
          channel: "room:ready"
          data:
            ready: true
      - emit:
          channel: "room:start"
          data: {}
          response:
            channel: "game:view"
      - loop:
          - emit:
              channel: "game:action"
              data:
                action:
                  type: "DRAW_CARD"
                  seq: 1
          - think: 1
        count: 5
