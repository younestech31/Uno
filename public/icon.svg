      <stop offset="0%" stop-color="#0B2B26" />
      <stop offset="100%" stop-color="#061916" />
    </linearGradient>
    <linearGradient id="cardRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
